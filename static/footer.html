<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Template</title>
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/fonts.css">
</head>
<body>
    <footer class="lato-regular">
        <div class="footer-row">
            <div class="footer-section">
                <span class="footer-title">

                </span>
                <div class="footer-list">
                    <span class="footer-link"><a href="#">About Us</a></span>
                    <span class="footer-link"><a href="#">Workshops</a></span>
                </div>
            </div>
            <div class="footer-section">
                <span class="footer-title">
                    Customer Care
                </span>

                    <span class="footer-link"><a href="#">FAQs</a></span>
                </div>
            </div>
            <div class="footer-section">
                <span class="footer-title">
                    Follow us on:
                </span>
                <div class="footer-list socials-box">
                    <span class="footer-link"><a href="#"><img src="assets/instagram.png" class="socials-icon" alt=""></a></span>
                    <span class="footer-link"><a href="#"><img src="assets/facebook.png" class="socials-icon"  alt=""></a></span>
                    <span class="footer-link"><a href="#"><img src="assets/youtube.png" class="socials-icon" alt=""></a></span>
                </div>
            </div>
            <div class="footer-section">
                <span class="footer-title">
                    Contacts
                </span>
                <div class="footer-list">
                    <div class="contact-item">
                        <span class="contact-text">Mobile:</span>
                        <span class="contact-link"><a href="tel:000000000">000000000</a></span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-text">WhatsApp:</span>
                        <span class="contact-link"><a href="https://wa.me/000000000">000000000</a></span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-text">Email:</span>
                        <span class="contact-link"></span><a href="mailto:abc.123@gmail.edu">abc.123@gmail.edu</a></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="copyright-bar">&#169; 2024, All Rights Reserved.</div>
    </footer>

</html>
